name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publica a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Usa a seção correspondente do CHANGELOG como corpo da release.
      # Se a versão ainda não estiver no arquivo, cai para as notas
      # geradas automaticamente pelo GitHub.
      - name: Monta as notas da versão
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 || index($0, "## " tag " ") == 1 {
              encontrou = 1; next
            }
            encontrou && index($0, "## ") == 1 { exit }
            encontrou { print }
          ' CHANGELOG.md > notas.md
          echo "Notas extraídas:"
          cat notas.md

      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notas.md ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "BanVic ${GITHUB_REF_NAME}" \
              --notes-file notas.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "BanVic ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
